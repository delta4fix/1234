<title>MM</title>
<style>
:root{color-scheme:dark;--bg:#000;--p:#0a0a0a;--line:#242424;--ink:#f4f4f4;--mut:#7c7c7c;--red:#ff5c5c;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans)}
body{display:grid;place-items:center;min-height:100vh;padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
form{width:min(360px,100%);display:grid;gap:14px;background:var(--p);border:1px solid var(--line);border-radius:4px;padding:22px}
h1{margin:0 0 4px;font:700 14px var(--mono);letter-spacing:.18em;text-transform:uppercase}
label{display:grid;gap:4px;font:600 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
input[type=text],input[type=password]{font:16px var(--sans);color:var(--ink);background:#121212;border:1px solid var(--line);border-radius:3px;padding:11px 12px;width:100%}
input:focus-visible,button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.rem{display:flex;align-items:center;gap:8px;font:14px var(--sans);letter-spacing:0;text-transform:none;color:var(--ink)}
.rem input{width:18px;height:18px}
button{font:700 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:#000;background:var(--ink);border:0;border-radius:3px;padding:13px;cursor:pointer}
button[disabled]{opacity:.5}
.err{color:var(--red);font-size:13px;min-height:1.2em;margin:0}
</style>
</head>
<body>
<form id="f" autocomplete="on" hidden>
  <h1>Acceso</h1>
  <label for="u">Usuario<input type="text" id="u" name="username" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" required></label>
  <label for="p">Contraseña<input type="password" id="p" name="password" autocomplete="current-password" required></label>
  <label class="rem" for="r"><input type="checkbox" id="r" checked> Recordar en este dispositivo</label>
  <button type="submit" id="b">Entrar</button>
  <p class="err" id="e" role="alert"></p>
</form>

const KEY='lk-mm';
const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const bu=a=>btoa(String.fromCharCode(...new Uint8Array(a)));
async function derive(user,pwd){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(user+'\0'+pwd),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:ub(D.s),iterations:D.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);
}
async function open(key){
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(D.i)},key,ub(D.c));
  const html=new TextDecoder().decode(pt);
  document.open();document.write(html);document.close();
}
async function boot(){
  if(location.hash==='#salir'){try{localStorage.removeItem(KEY)}catch(e){}history.replaceState(null,'',location.pathname)}
  let raw=null;try{raw=localStorage.getItem(KEY)}catch(e){}
  if(raw){try{const k=await crypto.subtle.importKey('raw',ub(raw),{name:'AES-GCM'},true,['decrypt']);await open(k);return}catch(e){try{localStorage.removeItem(KEY)}catch(_){}}}
  const f=document.getElementById('f');f.hidden=false;document.getElementById('u').focus();
  f.onsubmit=async ev=>{ev.preventDefault();const b=document.getElementById('b'),e=document.getElementById('e');
    b.disabled=true;b.textContent='Comprobando…';e.textContent='';
    try{const k=await derive(document.getElementById('u').value.trim(),document.getElementById('p').value);
      const raw=await crypto.subtle.exportKey('raw',k);
      if(document.getElementById('r').checked){try{localStorage.setItem(KEY,bu(raw))}catch(_){}}
      await open(k);
    }catch(err){e.textContent='Usuario o contraseña incorrectos.';b.disabled=false;b.textContent='Entrar';document.getElementById('p').select()}};
}
if(!window.crypto||!crypto.subtle){document.body.textContent='Este navegador no permite abrir la app. Ábrela con Safari actualizado.'}else boot();
})();
